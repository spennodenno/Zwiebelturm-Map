<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zwiebelturm-Karte</title>
<meta name="description" content="Kirchtürme in Mitteleuropa, gefärbt nach Dachform. Zwiebelhauben und ihre Varianten auf einen Blick.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2307090b'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%23ffb000'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Karte"></div>

<aside id="panel">
  <header>
    <h1>Zwiebelturm-Karte</h1>
    <button id="lang" type="button" aria-label="Sprache wechseln / switch language">EN</button>
  </header>
  <p id="lede"></p>
  <details id="legend-wrap" open>
    <summary id="legend-title"></summary>
    <ul id="legend"></ul>
    <p id="legend-hint" class="fine"></p>
    <div id="regions" class="fine"></div>
    <p id="credits" class="fine"></p>
  </details>
</aside>

<aside id="card" hidden aria-live="polite">
  <button id="card-close" type="button" aria-label="Schließen">×</button>
  <div id="card-body"></div>
</aside>

<div id="status" role="status"></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
