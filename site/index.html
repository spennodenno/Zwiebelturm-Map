<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zwiebelturm-Karte</title>
<meta name="description" content="Kirchtürme in Europa, gefärbt nach Dachform. Zwiebelhauben und ihre Varianten auf einen Blick.">
<script>
  /* theme before first paint: saved choice, otherwise the system setting */
  (function () {
    var t = 'dark';
    try {
      t = localStorage.getItem('zt-theme') ||
        (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    } catch (e) { /* private mode: keep dark */ }
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2307090b'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%23ffb000'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Karte"></div>

<aside id="panel">
  <header>
    <h1>Zwiebelturm-Karte</h1>
    <div class="tools">
      <button id="theme" type="button" class="tool"></button>
      <button id="lang" type="button" class="tool" aria-label="Sprache wechseln / switch language">EN</button>
    </div>
  </header>
  <p id="lede"></p>
  <details id="legend-wrap" open>
    <summary id="legend-title"></summary>
    <ul id="legend"></ul>
    <p id="legend-hint" class="fine"></p>
    <p class="fine"><button id="colors-reset" type="button" class="linkish" hidden></button></p>
    <h2 id="layers-title" class="section"></h2>
    <ul id="layers" class="toggles"></ul>
    <p id="credits" class="fine"></p>
  </details>
  <p class="fine foot"><button id="about-open" type="button" class="linkish"></button></p>
</aside>

<aside id="card" hidden aria-live="polite">
  <button id="card-close" type="button" aria-label="Schließen">×</button>
  <div id="card-body"></div>
</aside>

<dialog id="about" aria-labelledby="about-title">
  <div class="about-head">
    <h2 id="about-title"></h2>
    <button id="about-close" type="button" aria-label="Schließen">×</button>
  </div>
  <div id="about-body"></div>
</dialog>

<div id="status" role="status"></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
